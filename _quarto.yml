project:
  type: website

language:
  listing-page-filter: "Search the writing"

website:
  title: "rob taylor"
  image: ""
  favicon: ""
  navbar:
    background: light
    collapse: false
    left:
      - href: index.qmd
        text: Home
      - href: blog/index.qmd
        text: Writing
      - href: software/index.qmd
        text: Software
      - href: publications/index.qmd
        text: Publications
      - href: about/index.qmd
        text: About
  page-footer:
    left: "&copy; Rob Taylor"
    center: "Statistics, probability, and Bayesian thinking"
    right: "[robtaylor.co.nz](https://robtaylor.co.nz)"

format:
  html:
    toc: true
    anchor-sections: false
    smooth-scroll: true
    html-math-method: katex
    respect-user-color-scheme: true
    theme: [cosmo, theme.scss]
    css: styles.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    include-after-body:
      - file: _includes/newsletter.js

editor: visual
